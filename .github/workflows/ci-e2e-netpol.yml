name: ci-e2e-netpol

on:
  push:
    branches:
    - master
    - v[1-9].*
    - prep-v[1-9].*
    tags:
    - v*
  pull_request:
    branches:
    - master
    - v[1-9].*
    - prep-v[1-9].*
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Keep these in sync with ci.yml; update-deps will pin the SHAs.
  BUILDTIME_BASE: "golang:1.26.6-alpine3.24@sha256:af8d6740070b8906d12eae1c3e3ea0957fb63f492051ea05e354c38ef9fe88df"
  RUNTIME_BASE: "alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b"
  GO_VERSION: "~1.26.6"
  KUBE_ROUTER_IMAGE: "kube-router:e2e-test"
  KIND_VERSION: "v0.32.0"
  KIND_NODE_IMAGE: "kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5"

jobs:
  # Executes Integration Tests (require nft binary + kernel nftables support) 
  ci-integration-tests:
    name: ci-integration-tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
      id: go

    - name: Download Go modules
      run: go mod download

    - name: Install nftables
      run: |
        sudo apt-get update -y
        sudo apt-get install -y nftables

    - name: Run integration tests for kube-router netpol
      run: |
        sudo --preserve-env=PATH,HOME,GOPATH,GOROOT \
          make test-integration BUILD_IN_DOCKER=false

  e2e-netpol:
    name: e2e-netpol (${{ matrix.backend }}, default-deny=${{ matrix.default-deny }})
    runs-on: ubuntu-latest
    env:
      BACKEND: ${{ matrix.backend }}
      DEFAULT_DENY: ${{ matrix.default-deny }}
      KIND_CLUSTER_NAME: e2e
    strategy:
      fail-fast: false
      matrix:
        backend: [iptables, nftables]
        default-deny: [false, true]
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Go
      uses: ./.github/actions/setup-go
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Clean test cache
      run: go clean -testcache

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

    # Build the kube-router image from source and load it into the local Docker daemon.
    # The Dockerfile handles compilation in a builder stage, so no pre-built binary is needed.
    - name: Build kube-router container image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: .
        load: true
        build-args: |
          BUILDTIME_BASE=${{ env.BUILDTIME_BASE }}
          RUNTIME_BASE=${{ env.RUNTIME_BASE }}
        tags: ${{ env.KUBE_ROUTER_IMAGE }}

    - name: Install kind
      run: hack/e2e-netpol.sh install-kind

    - name: Create Kind cluster (dual-stack)
      run: hack/e2e-netpol.sh create-cluster

    - name: Load kube-router image into kind
      run: hack/e2e-netpol.sh load-image

    - name: Deploy kube-router (${{ matrix.backend }} NetworkPolicy backend)
      run: hack/e2e-netpol.sh deploy

    - name: Wait for kube-router to be ready
      run: hack/e2e-netpol.sh wait

    - name: Dump initial cluster state
      run: hack/e2e-netpol.sh dump-initial

    # Run the slow lifecycle specs (controller restart, chain GC) only on push,
    # tag, and manual dispatch - never on pull_request - so PRs stay fast while
    # merges to master, v-branches, and tags get the full regression coverage.
    - name: Run NetworkPolicy e2e tests
      run: hack/e2e-netpol.sh run-tests
      env:
        E2E_LONG: ${{ github.event_name != 'pull_request' && '1' || '' }}

    - name: Collect debug info on failure
      if: failure()
      run: hack/e2e-netpol.sh dump-debug

    - name: Delete Kind cluster
      if: always()
      run: hack/e2e-netpol.sh delete-cluster
